spring.application.name=backend

# ------------------------------------------------------------------
# CONEXAO COM O BANCO
# Os dados do banco (url, usuario e senha) ficam em secrets.properties,
# que NAO vai pro Git. Para rodar o projeto:
#   1. Nesta pasta, copie secrets.properties.example para secrets.properties
#   2. Preencha com os dados do SEU Postgres
#   3. Crie o banco "storege" no Postgres (as tabelas sao criadas sozinhas)
# ------------------------------------------------------------------
spring.config.import=classpath:secrets.properties

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.docker.compose.enabled=false
